<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Review Audit</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel-2:#f1f3f6; --border:#e2e5ea; --text:#1b1f24; --muted:#5d6672;
  --accent:#2f5bd3; --accent-soft:#e7edfb;
  --good:#1f8a4c; --good-soft:#e3f4ea; --ok:#a86a00; --ok-soft:#fbf0d9; --bad:#c23934; --bad-soft:#fbe5e4;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f1216; --panel:#171b21; --panel-2:#1e232b; --border:#2a313b; --text:#e6e9ee; --muted:#98a2b0;
    --accent:#7aa2ff; --accent-soft:#1f2a44; --good:#4cc283; --good-soft:#163024; --ok:#e3b04b; --ok-soft:#33290f;
    --bad:#f07570; --bad-soft:#3a1c1b; --shadow:none;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0 12px 0 0;font-weight:650}
header .meta{margin-left:auto;color:var(--muted);font-size:12px}
select,input{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px 9px}
button{font:inherit;cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:6px 11px}
button:hover{background:var(--panel-2)}
.layout{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 57px)}
aside{border-right:1px solid var(--border);background:var(--panel);padding:12px;overflow:auto;max-height:calc(100vh - 57px);position:sticky;top:57px}
aside input{width:100%;margin-bottom:10px}
.u{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;cursor:pointer}
.u:hover{background:var(--panel-2)} .u.sel{background:var(--accent-soft)}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:650;font-size:12px;background:var(--accent-soft);color:var(--accent);flex:none}
.av.lg{width:52px;height:52px;font-size:18px}
.u .nm{flex:1;min-width:0} .u .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u .nm span{color:var(--muted);font-size:12px}
main{padding:20px;min-width:0}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:14px;font-weight:650}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums} .kpi .l{color:var(--muted);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap;user-select:none}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--panel-2)}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.s-good{background:var(--good-soft);color:var(--good)} .s-ok{background:var(--ok-soft);color:var(--ok)}
.s-bad{background:var(--bad-soft);color:var(--bad)} .s-na{background:var(--panel-2);color:var(--muted)}
.bar{display:grid;grid-template-columns:150px 1fr 40px;align-items:center;gap:10px;margin:8px 0}
.bar .t{height:10px;background:var(--panel-2);border-radius:6px;overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:6px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:12px}
.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 12px;color:var(--muted)}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.muted{color:var(--muted)} .small{font-size:12px}
.empty{padding:40px;text-align:center;color:var(--muted)}
#drawer{position:fixed;inset:0 0 0 auto;width:min(760px,100%);background:var(--panel);border-left:1px solid var(--border);box-shadow:-8px 0 24px rgba(0,0,0,.15);transform:translateX(100%);visibility:hidden;transition:transform .2s,visibility .2s;overflow:auto;z-index:10;padding:20px}
#drawer.open{transform:none;visibility:visible}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);display:none;z-index:9} #scrim.open{display:block}
.thread{border:1px solid var(--border);border-radius:10px;margin:10px 0;overflow:hidden}
.thread .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px;background:var(--panel-2);font-size:12px}
.cm{padding:8px 10px;border-top:1px solid var(--border)} .cm b{font-size:12px}
.cm p{margin:4px 0 0;white-space:pre-wrap;word-break:break-word}
.issue{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--border)}
.issue>.badge,.issue>code{flex:none;margin-top:2px}
td.nw{white-space:nowrap}
ul.tp{margin:0;padding-left:18px} ul.tp li{margin:4px 0}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--panel-2);padding:1px 5px;border-radius:5px}
pre.std{white-space:pre-wrap;font-size:12.5px}
.mdv{line-height:1.55} .mdv h2{font-size:20px;margin:18px 0 8px} .mdv h3{font-size:16px;margin:16px 0 6px} .mdv h4,.mdv h5,.mdv h6{font-size:14px;margin:12px 0 4px}
.mdv p{margin:8px 0} .mdv ul,.mdv ol{margin:8px 0;padding-left:22px} .mdv li{margin:3px 0}
.mdv table.md{margin:10px 0;font-size:13px;display:block;overflow:auto} .mdv table.md th{cursor:default}
.mdv pre.code{background:var(--panel-2);padding:10px;border-radius:8px;overflow:auto;font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace}
.mdv blockquote{margin:10px 0;padding:4px 12px;border-left:3px solid var(--border);color:var(--muted)} .mdv hr{border:none;border-top:1px solid var(--border);margin:14px 0}
svg text{fill:var(--muted);font-size:11px}
[hidden]{display:none !important}
:root{--major:#e07b39}
@media (prefers-color-scheme: dark){:root{--major:#f0a060}}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.page-h h2{margin:0;font-size:20px} .page-h .sub{color:var(--muted);font-size:13px;margin-top:2px}
.hero{display:grid;grid-template-columns:230px 1fr;gap:16px;margin-bottom:16px}
.hero .gcard{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.kpis.big{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:0}
.kpi .s{margin-top:4px;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kpi.warn .v{color:var(--bad)} .kpi.good .v{color:var(--good)}
.delta{font-weight:650;font-size:12px;padding:0 6px;border-radius:999px} .delta.up{background:var(--good-soft);color:var(--good)} .delta.down{background:var(--bad-soft);color:var(--bad)} .delta.flat{background:var(--panel-2);color:var(--muted)}
.row2{display:grid;grid-template-columns:3fr 2fr;gap:16px;margin-bottom:16px} .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px} .rowe{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.row2>.card,.row3>.card,.rowe>.card{margin-bottom:0}
.card .cap{margin:-6px 0 12px;color:var(--muted);font-size:12.5px}
.card h3 .info{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px} .legend>div{display:flex;align-items:center;gap:6px} .legend i{width:11px;height:11px;border-radius:3px;display:inline-block} .legend i.dot{border-radius:50%} .legend b{font-variant-numeric:tabular-nums} .legend small{color:var(--muted);font-weight:400}
.legend.inline{justify-content:center}
.donutw{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
.stack{display:flex;height:26px;border-radius:8px;overflow:hidden;background:var(--panel-2)} .stack span{display:grid;place-items:center;color:#fff;font-size:12px;font-weight:650;min-width:2px}
.hbars{display:flex;flex-direction:column;gap:7px} .hb{display:grid;grid-template-columns:minmax(90px,38%) 1fr 54px;gap:10px;align-items:center;padding:2px 4px;border-radius:8px}
.hb.click{cursor:pointer} .hb.click:hover{background:var(--panel-2)}
.hb-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px} .hb-l small{display:block;color:var(--muted);font-size:11.5px}
.hb-t{height:12px;background:var(--panel-2);border-radius:7px;overflow:hidden} .hb-t i{display:block;height:100%;border-radius:7px} .hb-v{text-align:right;font-variant-numeric:tabular-nums;font-weight:650;font-size:13px}
.cols{display:flex;align-items:stretch;gap:10px} .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0} .col b{font-size:13px;font-variant-numeric:tabular-nums}
.col-b{flex:1;width:100%;display:flex;align-items:flex-end;background:var(--panel-2);border-radius:8px;overflow:hidden} .col-b i{display:block;width:100%;border-radius:6px 6px 0 0}
.col span{font-size:12px;color:var(--text);white-space:nowrap} .col small{font-size:11px;color:var(--muted)}
.plist{display:flex;flex-direction:column;gap:2px} .pitem{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:7px 6px;border-radius:10px;cursor:pointer} .pitem:hover{background:var(--panel-2)}
.pitem .mini{display:flex;gap:3px;margin-top:3px} .pitem .mini i{height:6px;width:34px;border-radius:3px;display:block}
.pitem .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .pitem .nm span{color:var(--muted);font-size:12px}
.attn{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:9px 6px;border-top:1px solid var(--border);cursor:pointer;align-items:start} .attn:first-of-type{border-top:none} .attn:hover{background:var(--panel-2)}
.attn .t{font-weight:600} .attn .d{color:var(--muted);font-size:12.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hc{display:inline-block;min-width:42px;text-align:center;padding:2px 8px;border-radius:7px;font-weight:650;font-variant-numeric:tabular-nums}
.areas .area{display:grid;grid-template-columns:130px 1fr 38px auto;gap:10px;align-items:center;margin:9px 0;font-size:13px}
.area .t{position:relative;height:12px;background:var(--panel-2);border-radius:7px} .area .t i{display:block;height:100%;border-radius:7px} .area .t u{position:absolute;top:-4px;width:2px;height:20px;background:var(--text);opacity:.7;border-radius:2px}
.uhero{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.howto{font-size:13px;color:var(--muted)} .howto b{color:var(--text)}
body.kiosk .hero{grid-template-columns:260px 1fr} body.kiosk .kpi .v{font-size:30px} body.kiosk .card{padding:20px} body.kiosk .page-h h2{font-size:26px}
@media (max-width:1100px){.row2,.rowe{grid-template-columns:1fr}.row3{grid-template-columns:1fr 1fr}.hero{grid-template-columns:1fr}}
@media (max-width:700px){.row3{grid-template-columns:1fr}.uhero{grid-template-columns:1fr;text-align:center}.areas .area{grid-template-columns:100px 1fr 34px}.areas .area .delta{display:none}}
.ctl{display:contents}
body.admin-view .layout,body.self .layout,body.kiosk .layout{grid-template-columns:1fr}
body.admin-view aside,body.self aside,body.kiosk aside,body.kiosk .ctl,body.kiosk #nav{display:none}
body.kiosk{font-size:16px} body.kiosk main{padding:28px}
#nav{display:flex;gap:4px} #nav[hidden]{display:none} #nav button.on{background:var(--accent-soft);border-color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:8px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px} .field input,.field select{width:100%}
label.chk{display:flex;gap:8px;align-items:center;font-size:13px;margin:4px 0;color:var(--text)} label.chk input{width:auto}
.scroll{overflow:auto}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600} .pill.ok{background:var(--good-soft);color:var(--good)} .pill.no{background:var(--bad-soft);color:var(--bad)}
details.help{background:var(--accent-soft);border-color:transparent} details.help summary{cursor:pointer}
.note{padding:8px 10px;border-radius:8px;background:var(--ok-soft);color:var(--ok);margin:8px 0} .note.bad{background:var(--bad-soft);color:var(--bad)}
.card.inner{background:var(--panel-2);box-shadow:none;margin:10px 0}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff} button.primary:hover{filter:brightness(.95);background:var(--accent)}
button.danger{color:var(--bad)} button:disabled{opacity:.45;cursor:default}
.toast{position:fixed;right:16px;bottom:16px;max-width:420px;background:var(--text);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:30;box-shadow:var(--shadow)} .toast.bad{background:var(--bad);color:#fff}
pre.log{white-space:pre-wrap;max-height:320px;overflow:auto;font-size:12px;background:var(--panel-2);padding:10px;border-radius:8px}
textarea.ed{width:100%;min-height:440px;font:12.5px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text)}
.split{display:flex;gap:14px;align-items:flex-start} .files{display:flex;flex-direction:column;gap:4px;min-width:170px} .files button{text-align:left} .files button.on{background:var(--accent-soft);border-color:var(--accent)}
progress{accent-color:var(--accent)}
@media (max-width:900px){.split{flex-direction:column}.files{flex-direction:row;flex-wrap:wrap}}
@media (max-width:900px){.layout{grid-template-columns:1fr} aside{position:static;max-height:none;border-right:none;border-bottom:1px solid var(--border)} .grid2{grid-template-columns:1fr} header .meta{margin-left:0}}
</style>
</head>
<body>
<header>
  <h1>Code Review Audit</h1>
  <span class="ctl">
  <select id="period" aria-label="Period">
    <option value="1">Last 1 month</option><option value="3" selected>Last 3 months</option>
    <option value="6">Last 6 months</option><option value="12">Last 12 months</option>
    <option value="all">All time</option><option value="custom">Custom…</option>
  </select>
  <span id="custom" style="display:none"><input type="date" id="since"> – <input type="date" id="until"></span>
  <select id="repo" aria-label="Project"><option value="">All projects</option></select>
  <button id="teamBtn">Overview</button>
  <button id="stdBtn">Standards</button>
  </span>
  <nav id="nav" hidden>
    <button id="dashBtn">Dashboard</button><button data-admin="run">Run</button><button data-admin="jobs">Jobs</button><button data-admin="repos">Repos</button>
    <button data-admin="skill">Skill &amp; models</button><button data-admin="access">Access</button>
  </nav>
  <span class="meta" id="meta"></span>
  <span class="small muted" id="who"></span><button id="out" hidden>Sign out</button>
</header>
<div class="layout">
  <aside><input id="q" placeholder="Search people…" aria-label="Search people"><div id="users"></div></aside>
  <main id="main"></main>
</div>
<div id="scrim"></div><div id="drawer"></div>

<script src="/charts.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => (s ?? "").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = v => v == null ? "–" : (+v).toFixed(1);
const cls = v => v == null ? "s-na" : (v = Math.round(v * 10) / 10) >= 4 ? "s-good" : v >= 3 ? "s-ok" : "s-bad";
const badge = v => `<span class="badge ${cls(v)}">${fmt(v)}</span>`;
const d10 = s => s ? s.slice(0,10) : "–";
const initials = u => (u.name || u.login || "?").replace(/[^A-Za-z ]/g," ").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase() || "?";
const label = u => u.login || u.name || u.uid;
// Small, safe Markdown renderer (headings, lists, tables, code, quotes, bold/italic/links). Text is escaped first.
function md(src){
  const inline = t => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<i>$2</i>")
    .replace(/\[([^\]]+)\]\(((?:https?:\/\/|\/|#)[^)\s]*|[\w./-]+)\)/g, (m, a, b) => `<a href="${b}" target="_blank" rel="noopener">${a}</a>`);
  const lines = String(src).replace(/\r/g, "").split("\n"), out = [], LI = /^\s*([-*]|\d+\.)\s+/, TR = /^\s*\|.*\|\s*$/;
  let i = 0, m;
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) { const buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]); i++; out.push(`<pre class="code">${esc(buf.join("\n"))}</pre>`); continue; }
    if ((m = l.match(/^(#{1,6})\s+(.*)$/))) { const n = Math.min(6, m[1].length + 1); out.push(`<h${n}>${inline(m[2])}</h${n}>`); i++; continue; }
    if (/^\s*(---+|\*\*\*+)\s*$/.test(l)) { out.push("<hr>"); i++; continue; }
    if (TR.test(l) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const head = cells(l), rows = []; i += 2;
      while (i < lines.length && TR.test(lines[i])) rows.push(cells(lines[i++]));
      out.push(`<table class="md"><thead><tr>${head.map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`); continue;
    }
    if (LI.test(l)) {
      const ord = /^\s*\d+\./.test(l), items = [];
      while (i < lines.length && LI.test(lines[i])) { let t = lines[i++].replace(LI, ""); while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !LI.test(lines[i])) t += " " + lines[i++].trim(); items.push(t); }
      const tag = ord ? "ol" : "ul"; out.push(`<${tag}>${items.map(t => `<li>${inline(t)}</li>`).join("")}</${tag}>`); continue;
    }
    if (/^>\s?/.test(l)) { const buf = []; while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, "")); out.push(`<blockquote>${inline(buf.join(" "))}</blockquote>`); continue; }
    if (!l.trim()) { i++; continue; }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !/^(#{1,6}\s|```|>)/.test(lines[i]) && !LI.test(lines[i]) && !TR.test(lines[i])) buf.push(lines[i++]);
    if (!buf.length) buf.push(lines[i++]);
    out.push(`<p>${inline(buf.join(" "))}</p>`);
  }
  return out.join("");
}
const S = {team: [], user: null, sort: {key: "prs", dir: -1}, tab: "prs"};

function range(){
  const p = $("#period").value, today = new Date().toISOString().slice(0,10);
  if (p === "all") return {since: "0000-01-01", until: "9999-12-31"};
  if (p === "custom") return {since: $("#since").value || "0000-01-01", until: $("#until").value || today};
  const d = new Date(); d.setMonth(d.getMonth() - +p);
  return {since: d.toISOString().slice(0,10), until: today};
}
function qs(){ const r = range(); return `since=${r.since}&until=${r.until}&repo=${encodeURIComponent($("#repo").value)}`; }
// location.origin never carries user:password, so fetch works however the page was opened; the browser
// re-sends the Basic login it already has for this origin
const api = p => fetch(location.origin + p, {credentials: "same-origin"}).then(r => { if (r.status === 401) { location.href = "/login"; return null; } return r.ok ? r.json() : null; });
let ME = {role: "viewer"};
const params = new URLSearchParams(location.search), KIOSK = params.get("kiosk") === "1";

async function boot(){
  ME = await api("/api/me"); if (!ME) return;
  document.body.classList.toggle("kiosk", KIOSK);
  document.body.classList.toggle("self", ME.role === "self");
  $("#who").textContent = `${ME.name || ME.login} · ${ME.role}`;
  if (ME.source === "github" || ME.source === "viewer") $("#out").hidden = false;
  if (ME.role === "self") { S.user = ME.uid; $("#teamBtn").hidden = true; }
  if (ME.role === "admin" && !KIOSK) {
    $("#nav").hidden = false;
    const sc = document.createElement("script"); sc.src = "/admin.js"; document.head.appendChild(sc);
    document.querySelectorAll("[data-admin]").forEach(b => b.onclick = () => Admin.show(b.dataset.admin));
  }
  const m = await api("/api/meta");
  for (const r of m.repos) $("#repo").insertAdjacentHTML("beforeend", `<option>${esc(r)}</option>`);
  $("#meta").textContent = `Data ${m.first ? d10(m.first)+" → "+d10(m.last) : "empty"} · last sync ${m.last_run ? d10(m.last_run) : "never"} ${m.pending_eval != null ? ` · ${m.pending_eval} PRs awaiting evaluation` : ""} · rubric ${m.rubric_version}${m.engines&&m.engines.heuristic?` · ${m.engines.heuristic} rule-based estimates`:""}`;
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("user") && ME.role !== "self") S.user = h.get("user");
  await refresh();
  if (KIOSK) {                                    // office TV: keep it fresh, optionally cycle through people (?rotate=20 seconds)
    setInterval(refresh, 5 * 60 * 1000);
    const rot = +params.get("rotate");
    if (rot) { let i = -1; setInterval(() => { if (!S.team.length) return; i = (i + 1) % (S.team.length + 1); if (i === S.team.length) showTeam(); else { S.user = S.team[i].uid; renderUsers(); showUser(S.user); } }, rot * 1000); }
  }
}
function leaveAdmin(){ if (window.Admin && Admin.stop) Admin.stop(); document.body.classList.remove("admin-view"); document.querySelectorAll("[data-admin]").forEach(b => b.classList.remove("on")); }
async function refresh(){
  S.team = await api(`/api/team?${qs()}`) || [];
  renderUsers();
  S.user ? showUser(S.user) : showTeam();
}
function renderUsers(){
  const q = $("#q").value.toLowerCase();
  const list = S.team.filter(u => !q || (label(u)+" "+(u.name||"")).toLowerCase().includes(q));
  $("#users").innerHTML = list.map(u => `
    <div class="u ${u.uid===S.user?"sel":""}" data-uid="${esc(u.uid)}">
      <div class="av">${esc(initials(u))}</div>
      <div class="nm"><b>${esc(label(u))}</b><span>${u.prs ? `${u.prs} PR${u.prs===1?"":"s"} · ${u.repos||0} project${u.repos===1?"":"s"}` : u.contributed ? `commits in ${u.contributed} shared PR${u.contributed===1?"":"s"}` : `reviews/commits only`}</span></div>
      ${badge(u.overall)}
    </div>`).join("") || `<div class="empty small">No activity in this period</div>`;
  document.querySelectorAll(".u").forEach(el => el.onclick = () => { S.user = el.dataset.uid; location.hash = "user="+encodeURIComponent(S.user); renderUsers(); showUser(S.user); });
}

function sortRows(rows, key, dir){ return [...rows].sort((a,b) => ((a[key] ?? -1) > (b[key] ?? -1) ? 1 : (a[key] ?? -1) < (b[key] ?? -1) ? -1 : 0) * dir); }
function table(cols, rows, onClick){
  const head = cols.map(c => `<th class="${c.n?"n":""}" data-k="${c.k}">${c.t}${S.sort.key===c.k?(S.sort.dir>0?" ▲":" ▼"):""}</th>`).join("");
  const body = rows.map((r,i) => `<tr class="${onClick?"click":""}" data-i="${i}">${cols.map(c => `<td class="${c.n?"n":""}${c.nw?" nw":""}">${c.f ? c.f(r) : esc(r[c.k] ?? "–")}</td>`).join("")}</tr>`).join("");
  return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}
function wire(container, rows, onClick, rerender){
  container.querySelectorAll("th").forEach(th => th.onclick = () => { const k = th.dataset.k; S.sort = {key:k, dir: S.sort.key===k ? -S.sort.dir : -1}; rerender(); });
  if (onClick) container.querySelectorAll("tbody tr").forEach(tr => tr.onclick = () => onClick(rows[+tr.dataset.i]));
}

const heatCell = v => `<span class="hc" style="${Charts.heat(v)}">${fmt(v)}</span>`;
const periodText = o => { const r = o.period; return r.since < "1900" ? "all time" : `${r.since} to ${r.until > "9000" ? "today" : r.until}`; };
const SEV = [["blocker", "Blocker", "var(--bad)"], ["major", "Major", "var(--major)"], ["minor", "Minor", "var(--ok)"], ["nit", "Nit", "var(--muted)"]];

  leaveAdmin();

    {k:"login", t:"Person", f:u => `<b>${esc(label(u))}</b>`}, {k:"prs", t:"PRs owned", n:1}, {k:"contributed", t:"Shared PRs", n:1, f:u => u.contributed||0},
    {k:"commits", t:"Commits", n:1, f:u => u.commits||0}, {k:"repos", t:"Projects", n:1},
    {k:"overall", t:"Overall", n:1, f:u => heatCell(u.overall)}, {k:"commit_msg", t:"Commit msgs", n:1, f:u => heatCell(u.commit_msg)},
    {k:"code_quality", t:"Code", n:1, f:u => heatCell(u.code_quality)}, {k:"validation", t:"Validation", n:1, f:u => heatCell(u.validation)},
    {k:"review_response", t:"Review resp.", n:1, f:u => heatCell(u.review_response)},
    {k:"reworked", t:"Reworked", n:1, f:u => u.reworked||0}, {k:"ignored_comments", t:"Ignored comments", n:1, f:u => u.ignored_comments||0},
    {k:"direct_pushes", t:"Direct pushes", n:1, f:u => u.direct_pushes||0}, {k:"reviews_given", t:"Reviews given", n:1, f:u => u.reviews_given||0}];
  const person = (t, why) => `<div class="pitem" data-uid="${esc(t.uid)}"><div class="av">${esc(initials({login: t.name}))}</div>
      <div class="nm"><b>${esc(t.name)}</b><span>${t.evaluated} scored PR${t.evaluated === 1 ? "" : "s"}</span><div class="mini" title="commits · code · validation · reviews">${["commit_msg", "code_quality", "validation", "review_response"].map(d => `<i style="background:${C.col(t[d])};opacity:${t[d] == null ? .25 : .9}" title="${d.replace("_", " ")}: ${fmt(t[d])}"></i>`).join("")}</div></div>

  $("#main").innerHTML = `
    <div class="page-h"><div><h2>Team overview</h2><div class="sub">${esc(periodText(o))} · ${k.people} ${k.people === 1 ? "person" : "people"} · ${o.projects.length} project${o.projects.length === 1 ? "" : "s"}${$("#repo").value ? " (filtered: " + esc($("#repo").value.split("/").pop()) + ")" : ""}</div></div>
      ${unscored > 0 ? `<span class="pill" title="These PRs are collected but have no score yet. An admin can score them from Run.">${unscored} PR${unscored === 1 ? "" : "s"} not scored yet</span>` : ""}</div>
    ${hasData ? `
    <div class="hero">
      <div class="card gcard">${C.gauge(k.overall, {size: 150, label: "Team score"})}
        <div>${C.delta(k.overall, pv && pv.overall)}</div>
        <div class="small muted">Average of ${k.evaluated} scored PRs.<br><b style="color:var(--good)">4+ good</b> · <b style="color:var(--ok)">3-4 acceptable</b> · <b style="color:var(--bad)">under 3 needs coaching</b></div></div>
      <div class="kpis big">
        ${kp(k.prs, "Pull requests", {delta: C.delta(k.prs, pv && pv.prs, {digits: 0}), sub: `${k.merged} merged · ${k.open} open · ${k.closed} closed`, tip: "PRs with activity in this period"})}
        ${kp(k.evaluated + "<small style='font-size:14px;color:var(--muted)'> / " + k.prs + "</small>", "Scored", {sub: k.prs ? Math.round(100 * k.evaluated / k.prs) + "% of PRs have a score" : "", tip: "PRs that have been evaluated"})}
        ${kp(k.blockers, "Blocker issues", {tone: k.blockers ? "warn" : "good", delta: C.delta(k.blockers, pv && pv.blockers, {digits: 0, better: "down"}), sub: `${k.majors} major`, tip: "Serious problems found in scored PRs (security, data loss, broken behaviour)"})}
        ${kp(k.tests_pct == null ? "–" : k.tests_pct + "%", "PRs with tests", {delta: C.delta(k.tests_pct, pv && pv.tests_pct, {digits: 0, unit: "%"}), sub: "of scored PRs added or changed tests", tip: "Share of scored PRs that touched test files"})}
        ${kp(k.reworked, "Reworked PRs", {delta: C.delta(k.reworked, pv && pv.reworked, {digits: 0, better: "down"}), sub: "later fixed or reverted", tip: "PRs that needed a follow-up fix or a revert"})}
        ${kp(k.avg_lines == null ? "–" : k.avg_lines.toLocaleString(), "Average PR size", {delta: C.delta(k.avg_lines, pv && pv.avg_lines, {digits: 0, better: "down"}), sub: "lines changed", tip: "Smaller PRs are easier to review and score better"})}
        ${kp(o.extras.direct_pushes, "Direct pushes", {tone: o.extras.direct_pushes ? "warn" : "good", sub: "to the default branch, no PR", tip: "Commits pushed without a pull request"})}
        ${kp(o.extras.ignored_comments, "Ignored comments", {tone: o.extras.ignored_comments ? "warn" : "", sub: "valid review comments left open", tip: "Valid review comments that were dismissed or never addressed"})}
        ${kp(k.ci_fail_pct == null ? "–" : k.ci_fail_pct + "%", "CI red at last commit", {sub: "includes deploy-preview failures", tip: "Overall CI status of the last commit. Deploy previews (Vercel etc.) often fail for reasons unrelated to quality."})}
        ${kp(o.extras.reviews_given, "Reviews given", {sub: "by everyone, in this period"})}
      </div></div>
    <div class="row2">
      <div class="card"><h3>Quality over time <span class="info">how PR volume and score moved</span></h3><div class="cap">Bars show how many PRs had activity each month; the dots show that month's average score.</div>${C.trend(o.trend)}</div>
      <div class="card"><h3>Score by area <span class="info">where the team is strong or weak</span></h3><div class="cap">Team average in each of the four areas that make up a score.</div>
        ${C.radar(dims.map(d => d[2]), [{name: "This period", values: dims.map(d => k[d[0]]), color: "var(--accent)"}].concat(pv ? [{name: "Previous period", values: dims.map(d => pv[d[0]]), color: "var(--muted)", fill: 0.04, dash: 1}] : []), {size: 250})}
        <div class="areas">${dims.map(d => `<div class="area"><span>${d[1]}</span><div class="t"><i style="width:${k[d[0]] ? (k[d[0]] - 1) / 4 * 100 : 0}%;background:${C.col(k[d[0]])}"></i></div><b>${fmt(k[d[0]])}</b>${C.delta(k[d[0]], pv && pv[d[0]])}</div>`).join("")}</div></div>
    </div>
    <div class="row3">
      <div class="card"><h3>How scores are spread</h3><div class="cap">Number of scored PRs in each score band.</div>
        ${C.columns(o.distribution.map(b => ({label: b.label, value: b.count, color: b.label === "4-5" ? "var(--good)" : b.label === "3-4" ? "var(--ok)" : "var(--bad)", sub: k.evaluated ? Math.round(100 * b.count / k.evaluated) + "%" : ""})), {empty: "No scored PRs yet"})}</div>
      <div class="card"><h3>Issues found by severity</h3><div class="cap">Problems the reviewer found in scored PRs.</div>
        <div class="donutw">${C.donut(SEV.map(x => ({label: x[1], value: o.severity[x[0]] || 0, color: x[2]})), {size: 140, center: String(SEV.reduce((a, x) => a + (o.severity[x[0]] || 0), 0)), sub: "issues"})}
        ${C.legend(SEV.map(x => ({label: x[1], value: o.severity[x[0]] || 0, color: x[2]})))}</div></div>
      <div class="card"><h3>What happened to review comments</h3><div class="cap">Of the comments judged valid, how they ended up.</div>
        ${validTotal ? C.stack([{label: "Fixed in code", value: th.fixed_in_code, color: "var(--good)"}, {label: "Explained", value: th.explained, color: "var(--accent)"}, {label: "Dismissed", value: th.dismissed, color: "var(--bad)"}, {label: "Left open", value: th.open, color: "var(--ok)"}])
          : `<div class="empty small">No review-comment assessments in this period.</div>`}
        <div class="small muted" style="margin-top:8px">${th.valid || 0} valid · ${th.nitpick || 0} nitpicks · ${th.invalid || 0} invalid comments assessed</div></div>
    </div>
    <div class="rowe">
      <div class="card"><h3>Projects <span class="info">click one to filter</span></h3><div class="cap">Average score per project. Bar length is the score (out of 5).</div>
        <div id="projChart">${C.hbars(o.projects.filter(p => p.overall != null).sort((a, b) => b.prs - a.prs).slice(0, 14).map(p => ({label: p.repo.split("/").pop(), key: p.repo, value: p.overall - 1, text: fmt(p.overall), sub: `${p.prs} PRs · ${p.people} ${p.people === 1 ? "person" : "people"}${p.blockers ? " · " + p.blockers + " blocker" + (p.blockers === 1 ? "" : "s") : ""}`, color: C.col(p.overall)})), {max: 4, empty: "No scored projects yet"})}</div></div>
      <div class="card"><h3>Does PR size matter?</h3><div class="cap">Average score by lines changed. Big PRs are harder to review well.</div>
        ${C.columns(o.sizes.map(b => ({label: b.label, value: b.overall == null ? 0 : b.overall - 1, top: b.overall == null ? "–" : fmt(b.overall), color: C.col(b.overall), sub: b.prs + " PRs"})), {max: 4, h: 190, empty: "No data"})}
        <div class="small muted" style="margin-top:8px">Lines changed per PR (additions plus deletions).</div></div>
    </div>
    <div class="rowe">
      <div class="card"><h3>Doing well <span class="info">highest scores, 2+ scored PRs</span></h3><div class="cap">Click a person to open their page. The four small bars are commits · code · validation · reviews.</div>
        <div class="plist" id="topList">${o.top.map(person).join("") || `<div class="empty small">Not enough scored PRs yet</div>`}</div></div>
      <div class="card"><h3>Could use coaching <span class="info">lowest scores, 2+ scored PRs</span></h3><div class="cap">A starting point for 1:1s: open a person to see specific talking points.</div>
        <div class="plist" id="coachList">${o.coaching.map(person).join("") || `<div class="empty small">Not enough scored PRs yet</div>`}</div></div>
    </div>
    <div class="rowe">
      <div class="card"><h3>Reviewer quality <span class="info">how well reviewers catch problems</span></h3><div class="cap">Average review score per reviewer (2+ assessed reviews). Higher means they caught more of what was wrong.</div>
        <div id="revChart">${C.hbars(o.reviewers.map(r => ({label: r.name, key: r.uid, value: r.avg - 1, text: fmt(r.avg), sub: r.n + " reviews assessed", color: C.col(r.avg)})), {max: 4, empty: "No reviewer assessments yet"})}</div></div>
      <div class="card"><h3>Needs attention <span class="info">${o.attention.length} PR${o.attention.length === 1 ? "" : "s"}</span></h3><div class="cap">Lowest-scoring PRs and anything with a blocker issue.</div>
        <div id="attnList" style="max-height:420px;overflow:auto">${o.attention.map(a => `<div class="attn" data-pr="${a.id}"><div>${badge(a.overall)}</div>
          <div><div class="t">${esc(a.repo.split("/").pop())} #${a.number} · ${esc(a.title)}</div><div class="d">${a.blockers ? `<span class="badge s-bad">${a.blockers} blocker${a.blockers === 1 ? "" : "s"}</span> ` : ""}${esc(a.issue || "")}</div></div>
          <div class="small muted">${esc(a.author || "")}</div></div>`).join("") || `<div class="empty small">Nothing needs attention.</div>`}</div></div>
    </div>` : `<div class="card"><div class="empty">No PRs in this period. An admin can load data with <b>Run</b>, or switch the period above.</div></div>`}
    <div class="card"><h3>People scorecard <span class="info">click a column to sort, a row to open the person</span></h3><div class="cap">Cell colour follows the score: green is good, red needs work.</div><div id="scorecard" style="overflow:auto"></div></div>
    <div class="card howto"><b>How to read this page.</b> Every PR gets four scores from 1 to 5: <b>commit messages</b> (15%), <b>code quality</b> (40%), <b>validation and tests</b> (20%) and <b>how review feedback was handled</b> (25%); the overall score is their weighted average. A person's score is the average of their own share of each PR: the PR owner answers for validation and review handling, and every committer for the commit messages and code of their own commits. “Reworked” means the PR later needed a fix or revert; “Ignored comments” are valid review comments that were dismissed or left open. Arrows compare with the previous period of the same length${pv ? ` (${esc(pv.since)} to ${esc(pv.until)})` : ""}. Full rules: <a href="#" id="stdLink">Standards</a>.</div>`;
  const drawTable = () => {
    const rows = sortRows(S.team, S.sort.key, S.sort.dir);
    $("#scorecard").innerHTML = rows.length ? table(cols, rows, 1) : '<div class="empty">No people found in this period.</div>';
    wire($("#scorecard"), rows, u => { S.user = u.uid; location.hash = "user=" + encodeURIComponent(u.uid); renderUsers(); showUser(u.uid); }, drawTable);
  };
  drawTable();
  const openUser = uid => { S.user = uid; location.hash = "user=" + encodeURIComponent(uid); renderUsers(); showUser(uid); };
  document.querySelectorAll("#topList .pitem, #coachList .pitem").forEach(el => el.onclick = () => openUser(el.dataset.uid));
  document.querySelectorAll("#attnList .attn").forEach(el => el.onclick = () => openPr(el.dataset.pr));
  document.querySelectorAll("#projChart .hb").forEach(el => el.onclick = () => { $("#repo").value = el.dataset.k; refresh(); });
  document.querySelectorAll("#revChart .hb").forEach(el => el.onclick = () => openUser(el.dataset.k));
  const sl = $("#stdLink"); if (sl) sl.onclick = e => { e.preventDefault(); $("#stdBtn").click(); };
}

async function showUser(uid){
  leaveAdmin();
  const d = await api(`/api/user/${encodeURIComponent(uid)}?${qs()}`);
  if (!d) { $("#main").innerHTML = `<div class="empty">User not found</div>`; return; }
  const s = d.summary || {}, u = d.user;
  const C = Charts, kp = C.kpi;
  const dims = [["commit_msg", "Commit messages", "Commits"], ["code_quality", "Code quality", "Code"], ["validation", "Validation & tests", "Validation"], ["review_response", "Review handling", "Reviews"]];
  const mean = a => { a = a.filter(v => v != null); return a.length ? a.reduce((x, y) => x + y, 0) / a.length : null; };
  const ta = key => mean(S.team.map(t => t[key]));                       // team average for the same period
  const ranked = S.team.filter(t => t.overall != null).sort((a, b) => b.overall - a.overall);
  const rank = ranked.findIndex(t => t.uid === u.uid) + 1;
  const owned = d.prs.filter(p => p.role === "owner" && p.kind !== "promotion");
  const states = {merged: owned.filter(p => p.state === "merged").length, open: owned.filter(p => p.state === "open").length, closed: owned.filter(p => p.state === "closed").length};
  const sev = {blocker: 0, major: 0, minor: 0, nit: 0}; d.my_issues.forEach(i => { sev[i.severity] = (sev[i.severity] || 0) + 1; });
  const sevParts = SEV.map(x => ({label: x[1], value: sev[x[0]] || 0, color: x[2]}));
  const vs = {vs: "team average"};
  $("#main").innerHTML = `
    <div class="card uhero">
      <div style="display:flex;gap:14px;align-items:center"><div class="av lg">${esc(initials(u))}</div>
      <div><div style="font-size:20px;font-weight:700">${esc(u.name || u.login || u.uid)}</div>
        <div class="small muted">${u.login ? "@" + esc(u.login) + " · " : ""}${d.aliases.map(esc).join(", ")}</div>
        <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">${rank ? `<span class="pill">Rank ${rank} of ${ranked.length}</span>` : ""}
          ${s.overall != null && ta("overall") != null ? `<span class="pill" style="background:var(--panel-2);color:var(--text)">Team average ${fmt(ta("overall"))} ${C.delta(s.overall, ta("overall"), vs)}</span>` : ""}</div></div></div>
      <div class="small muted" style="max-width:420px">${s.evaluated ? `Based on ${s.evaluated} scored PR${s.evaluated === 1 ? "" : "s"} owned in this period${s.contributed ? ` and commits in ${s.contributed} shared PR${s.contributed === 1 ? "" : "s"}` : ""}.` : "No scored PRs in this period yet."}</div>
      <div>${C.gauge(s.overall, {size: 130, label: "Overall"})}</div>
    </div>
    <div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">
      ${kp(s.prs || 0, "PRs owned", {sub: `${states.merged} merged · ${states.open} open · ${states.closed} closed`})}${kp(s.contributed || 0, "Shared PRs", {sub: "commits in others' PRs"})}${kp(s.commits || 0, "Commits authored")}${kp(s.repos || 0, "Projects")}
      ${kp((s.evaluated || 0) + "/" + (s.prs || 0), "Owned PRs scored")}${kp(s.reworked || 0, "Reworked", {tone: s.reworked ? "warn" : "", sub: "later fixed or reverted"})}
      ${kp(s.ignored_comments || 0, "Comments ignored", {tone: s.ignored_comments ? "warn" : "", sub: "valid, dismissed or open"})}${kp(s.direct_pushes || 0, "Direct pushes", {tone: s.direct_pushes ? "warn" : ""})}${kp(s.reviews_given || 0, "Reviews given")}
    </div>
    <div class="rowe">
      <div class="card"><h3>Score by area <span class="info">compared with the team</span></h3><div class="cap">The line marks the team average. The dashed shape on the chart is the team.</div>
        <div class="row2" style="grid-template-columns:1fr;margin:0">${C.radar(dims.map(x => x[2]), [{name: u.login || u.name || "This person", values: dims.map(x => s[x[0]]), color: "var(--accent)"}, {name: "Team average", values: dims.map(x => ta(x[0])), color: "var(--muted)", fill: 0.04, dash: 1}], {size: 250})}</div>
        <div class="areas">${dims.map(x => `<div class="area"><span>${x[1]}</span><div class="t"><i style="width:${s[x[0]] ? (s[x[0]] - 1) / 4 * 100 : 0}%;background:${C.col(s[x[0]])}"></i>${ta(x[0]) != null ? `<u style="left:${(ta(x[0]) - 1) / 4 * 100}%" title="team average ${fmt(ta(x[0]))}"></u>` : ""}</div><b>${fmt(s[x[0]])}</b>${C.delta(s[x[0]], ta(x[0]), vs)}</div>`).join("")}</div>
        <div class="small muted" style="margin-top:8px">Weights: commits 15% · code 40% · validation 20% · review handling 25%. On others' PRs only commits and code count.</div></div>
      <div class="card"><h3>Trend <span class="info">by month</span></h3><div class="cap">Bars are PRs per month; dots are that month's average score.</div>${C.trend(d.trend, {w: 560, h: 220})}</div>
    </div>
    <div class="row3">
      <div class="card"><h3>Projects</h3><div class="cap">Average score in each project they worked on.</div>
        ${C.hbars(d.projects.filter(p => p.overall != null).map(p => ({label: p.repo.split("/").pop(), value: p.overall - 1, text: fmt(p.overall), sub: `${p.prs} owned${p.contributed ? " · " + p.contributed + " shared" : ""}`, color: C.col(p.overall)})), {max: 4, empty: "No scored projects yet"})}</div>
      <div class="card"><h3>PR outcomes</h3><div class="cap">What happened to the PRs they own.</div>
        <div class="donutw">${C.donut([{label: "Merged", value: states.merged, color: "var(--good)"}, {label: "Open", value: states.open, color: "var(--accent)"}, {label: "Closed unmerged", value: states.closed, color: "var(--bad)"}], {size: 130, center: String(owned.length), sub: "PRs"})}
        ${C.legend([{label: "Merged", value: states.merged, color: "var(--good)"}, {label: "Open", value: states.open, color: "var(--accent)"}, {label: "Closed unmerged", value: states.closed, color: "var(--bad)"}])}</div></div>
      <div class="card"><h3>Issues in their code</h3><div class="cap">By severity, as found in review.</div>
        <div class="donutw">${C.donut(sevParts, {size: 130, center: String(d.my_issues.length), sub: "issues"})}${C.legend(sevParts)}</div></div>
    </div>
    <div class="card"><h3>Projects worked on</h3><div id="proj"></div></div>
    <div class="card"><h3>Issues in their own code (${d.my_issues.length})</h3><div id="myi"></div></div>
    <div class="card">
      <div class="tabs"><button data-t="prs">Pull requests (${d.prs.length})</button><button data-t="rev">As reviewer (${d.reviews.length})</button><button data-t="dp">Direct pushes (${d.direct_pushes.length})</button></div>
      <div id="tab" style="overflow:auto"></div>
    </div>`;
  $("#myi").innerHTML = d.my_issues.length ? d.my_issues.map(i=>`<div class="issue"><span class="badge ${sevCls[i.severity]||"s-na"}">${esc(i.severity)}</span><div><a href="#" data-pr="${i.pr_id}">${esc(i.repo.split("/")[1])} #${i.number}</a> <code>${esc(i.file)}${i.line?":"+i.line:""}</code>${i.commit_sha?` <code>${esc(String(i.commit_sha).slice(0,8))}</code>`:""} ${esc(i.issue)}</div></div>`).join("") : `<div class="small muted">No issues traced to their commits.</div>`;
  $("#myi").querySelectorAll("[data-pr]").forEach(a => a.onclick = e => { e.preventDefault(); openPr(a.dataset.pr); });
  $("#proj").innerHTML = table([{k:"repo",t:"Project"},{k:"prs",t:"PRs owned",n:1},{k:"contributed",t:"Shared PRs",n:1},{k:"merged",t:"Merged",n:1},{k:"overall",t:"Avg score",n:1,f:r=>badge(r.overall)},{k:"reworked",t:"Reworked",n:1},{k:"ignored",t:"Ignored comments",n:1}], d.projects);
  const tabs = {
    prs: () => { const cols = [{k:"repo",t:"Project"},{k:"number",t:"PR",f:r=>`#${r.number} ${esc(r.title)}`},{k:"role",t:"Role",f:r=>r.role==="owner"?`<span class="badge s-na">owner</span>`:`<span class="badge s-ok" title="Committed to ${esc(r.owner)}'s PR">${r.my_commits} commit${r.my_commits===1?"":"s"} in ${esc(r.owner)}'s PR</span>`},{k:"state",t:"State",f:r=>`<span class="badge ${r.state==="merged"?"s-good":r.state==="closed"?"s-bad":"s-ok"}">${esc(r.state==="closed"?"closed (not merged)":r.state)}</span>`},{k:"activity_at",t:"Last activity",nw:1,f:r=>d10(r.activity_at)},
        {k:"reviewers",t:"Reviewed by"},{k:"commit_msg",t:"Commits",n:1,f:r=>badge(r.commit_msg)},{k:"code_quality",t:"Code",n:1,f:r=>badge(r.code_quality)},
        {k:"validation",t:"Valid.",n:1,f:r=>badge(r.validation)},{k:"review_response",t:"Review resp.",n:1,f:r=>badge(r.review_response)},{k:"overall",t:"Overall",n:1,f:r=>badge(r.overall)},
        {k:"flags",t:"Flags",f:r=>[r.kind==="promotion"?`<span class="badge s-na" title="Branch promotion (${esc(r.head_branch)} → ${esc(r.base_branch)}): not scored">promotion</span>`:"", r.reworked?`<span class="badge s-bad">reworked</span>`:"", r.ignored?`<span class="badge s-ok">${r.ignored} ignored</span>`:"", r.ci_status==="FAILURE"?`<span class="badge s-bad">CI red</span>`:"", r.needs_split?`<span class="badge s-ok" title="Shared PR scored before per-person scoring; awaiting re-evaluation">split pending</span>`:""].join(" ")}];
      const draw = () => { const rows = sortRows(d.prs, (d.prs[0] && S.sort.key in d.prs[0]) ? S.sort.key : "activity_at", S.sort.dir); $("#tab").innerHTML = rows.length ? table(cols, rows, 1) : `<div class="empty">No PRs</div>`; wire($("#tab"), rows, r => openPr(r.id), draw); }; draw(); },
    rev: () => { const cols = [{k:"repo",t:"Project"},{k:"number",t:"PR",f:r=>`#${r.number} ${esc(r.title)}`},{k:"author",t:"Author"},{k:"size",t:"Lines",n:1},{k:"states",t:"Verdict"},
        {k:"comments",t:"Comments",n:1},{k:"score",t:"Review score",n:1,f:r=>badge(r.score)},{k:"missed",t:"Missed",f:r=>{const m=JSON.parse(r.missed||"[]");return m.length?`<span class="badge s-bad">${m.length} missed</span> <span class="small">${esc(m[0])}</span>`:""}}];
      const rows = d.reviews; $("#tab").innerHTML = rows.length ? table(cols, rows, 1) : `<div class="empty">No reviews given</div>`; wire($("#tab"), rows, r => openPr(r.pr_id), tabs.rev); },
    dp: () => { $("#tab").innerHTML = d.direct_pushes.length ? table([{k:"repo",t:"Project"},{k:"sha",t:"Commit",f:r=>`<code>${esc(r.sha.slice(0,8))}</code>`},{k:"authored_at",t:"Date",nw:1,f:r=>d10(r.authored_at)},{k:"message",t:"Message",f:r=>esc(r.message.split("\n")[0])}], d.direct_pushes) : `<div class="empty">No direct pushes to the default branch</div>`; }
  };
  const go = t => { S.tab = t; document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.t===t)); tabs[t](); };
  document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => go(b.dataset.t));
  go(S.tab);
}

const sevCls = {blocker:"s-bad", major:"s-bad", minor:"s-ok", nit:"s-na"};
const valCls = {valid:"s-good", nitpick:"s-na", invalid:"s-bad"};
const resCls = {fixed_in_code:"s-good", explained:"s-good", dismissed:"s-bad", open:"s-ok"};
async function openPr(id){
  const p = await api(`/api/pr/${id}`); if (!p) return;
  if (p.redacted) {                               // you only reviewed this PR: the author's scores are not yours to see
    $("#drawer").innerHTML = `<div style="display:flex;justify-content:space-between;gap:10px"><div><div class="small muted">${esc(p.repo)} · #${p.number} · by ${esc(p.author_login)}</div>
      <h2 style="margin:4px 0 8px;font-size:18px">${esc(p.title)}</h2></div><button id="close" aria-label="Close">✕</button></div>
      <div class="card"><b>You reviewed this pull request.</b> Its scores belong to its author, so only your reviewer assessment is shown. ${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">Open on GitHub ↗</a>` : ""}</div>
      ${p.reviewer_evals.length ? `<div class="card"><h3>Your review</h3>${p.reviewer_evals.map(r => `<div class="issue">${badge(r.score)}<div>${esc(r.notes)}${r.missed.length ? `<div class="small">Missed: ${r.missed.map(esc).join("; ")}</div>` : ""}</div></div>`).join("")}</div>` : `<div class="card small muted">No assessment of your review yet.</div>`}`;
    $("#drawer").scrollTop = 0; $("#drawer").classList.add("open"); $("#scrim").classList.add("open"); $("#close").onclick = closePr;
    return;
  }
  const sc = [["commit_msg","Commits"],["code_quality","Code"],["validation","Validation"],["review_response","Review response"],["overall","Overall"]];
  $("#drawer").innerHTML = `
    <div style="display:flex;justify-content:space-between;gap:10px"><div>
      <div class="small muted">${esc(p.repo)} · #${p.number} · by ${esc(p.author_login)}</div>
      <h2 style="margin:4px 0 8px;font-size:18px">${esc(p.title)}</h2></div><button id="close" aria-label="Close">✕</button></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">
      <span class="badge ${p.state==="merged"?"s-good":p.state==="closed"?"s-bad":"s-ok"}">${esc(p.state==="closed"?"closed without merge":p.state)}</span><span class="badge ${p.ci_status==="SUCCESS"?"s-good":p.ci_status==="FAILURE"?"s-bad":"s-na"}">CI ${esc(p.ci_status||"unknown")}</span>
      <span class="badge s-na">+${p.additions} −${p.deletions} · ${p.changed_files} files</span>
      <span class="badge s-na">created ${d10(p.created_at)}${p.merged_at?" · merged "+d10(p.merged_at)+(p.merged_by?" by "+esc(p.merged_by):""):p.closed_at?" · closed "+d10(p.closed_at):""}</span>
      <span class="badge ${p.tests_added?"s-good":"s-ok"}">${p.tests_added?"tests added":"no tests added"}</span>
      <a href="${esc(p.url)}" target="_blank" rel="noopener">Open on GitHub ↗</a></div>
    ${p.kind==="promotion" ? `<div class="card"><b>Branch promotion</b> (${esc(p.head_branch)} → ${esc(p.base_branch)}). It carries changes already reviewed in their own PRs, so it isn't scored.</div>` : p.overall==null ? `<div class="card"><b>Not evaluated yet</b> for the current code version.</div>` : `
    <div class="card"><div style="display:flex;gap:14px;flex-wrap:wrap">${sc.map(([k,l])=>`<div><div class="small muted">${l}</div>${badge(p[k])}</div>`).join("")}</div>
      <p style="margin:12px 0 0">${esc(p.summary)}</p>
      <p class="small muted" style="margin:8px 0 0">${p.engine==="heuristic"?"⚠ Rule-based estimate (no LLM): code quality reflects pattern checks only, not a reading of the logic.":p.engine==="anthropic-api"?`Scored by Claude via the Anthropic API${p.model ? ` (${esc(p.model)}${p.agent ? `, ${esc(p.agent)} agent` : ""}${p.skill_hash ? `, skill ${esc(p.skill_hash)}` : ""})` : ""}.`:"Scored by Claude (agent review)."}</p></div>
    ${p.talking_points.length?`<div class="card"><h3>1:1 talking points</h3><ul class="tp">${p.talking_points.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`:""}
    ${p.people.length>1?`<div class="card"><h3>Who answers for what</h3><div style="overflow:auto">
      <table><thead><tr><th>Person</th><th>Role</th><th class="n">Commits</th><th class="n">Lines</th><th class="n">Commit msgs</th><th class="n">Code</th><th class="n">Validation</th><th class="n">Review resp.</th><th class="n">Their score</th></tr></thead><tbody>
      ${p.people.map(x=>`<tr><td><b>${esc(x.login)}</b>${x.notes?`<div class="small muted">${esc(x.notes)}</div>`:""}</td><td>${x.is_owner?"owner":"committer"}</td><td class="n">${x.commits}</td><td class="n nw">+${x.additions} −${x.deletions}</td>
        <td class="n">${badge(x.commit_msg)}</td><td class="n">${badge(x.code_quality)}</td><td class="n">${x.is_owner?badge(x.validation):"–"}</td><td class="n">${x.is_owner?badge(x.review_response):"–"}</td><td class="n">${x.scored?badge(x.overall):`<span class="badge s-ok">pending</span>`}</td></tr>`).join("")}</tbody></table></div>
      <div class="small muted" style="margin-top:6px">The owner answers for validation and review response; each committer for the commit messages and code of their own commits. Merge commits don't count.</div></div>`:""}
    <div class="card"><h3>Commit messages</h3><p class="small">${esc(p.commit_notes)}</p>
      ${p.commits.map(c=>`<div class="issue"><code>${esc(c.sha.slice(0,8))}</code><span class="small muted">${esc(c.author)}${c.coauthors?" + "+esc(c.coauthors):""}</span><span>${esc(c.message.split("\n")[0])}</span></div>`).join("")}</div>
    <div class="card"><h3>Code issues found (${p.code_issues.length})</h3>
      ${p.code_issues.map(i=>`<div class="issue"><span class="badge ${sevCls[i.severity]||"s-na"}">${esc(i.severity)}</span><div><code>${esc(i.file)}${i.line?":"+i.line:""}</code>${i.author?` <span class="badge s-na">${esc(i.author)}</span>`:""} ${esc(i.issue)}
        <div class="small ${i.caught_by_reviewer?"":"muted"}">${i.caught_by_reviewer?"✓ raised by reviewer":"✗ not raised in review"}</div></div></div>`).join("") || `<div class="small muted">None above nit level.</div>`}
      ${p.validation_notes?`<p class="small"><b>Validation:</b> ${esc(p.validation_notes)}</p>`:""}</div>`}
    <div class="card"><h3>Review conversation (${p.threads.length} threads)</h3>
      ${p.reviews.map(r=>`<div class="small"><b>${esc(r.reviewer)}</b> — ${esc(r.state)} · ${d10(r.submitted_at)}${r.body?": "+esc(r.body):""}</div>`).join("")}
      ${p.threads.map(t=>`<div class="thread"><div class="hd"><code>${esc(t.path||"")}${t.line?":"+t.line:""}</code>
          <span class="badge ${t.is_resolved?"s-good":"s-ok"}">${t.is_resolved?"marked resolved":"unresolved"}</span>
          ${t.eval?`<span class="badge ${valCls[t.eval.validity]}">${esc(t.eval.validity)}</span><span class="badge ${resCls[t.eval.resolution]}">${esc(t.eval.resolution.replace(/_/g," "))}</span>${t.eval.fix_sha?`<code>${esc(t.eval.fix_sha.slice(0,8))}</code>`:""}`:""}</div>
          ${t.comments.map(c=>`<div class="cm"><b>${esc(c.author)}</b> <span class="small muted">${d10(c.created_at)}</span><p>${esc(c.body)}</p></div>`).join("")}
          ${t.eval&&t.eval.note?`<div class="cm small"><b>Assessment:</b> ${esc(t.eval.note)}</div>`:""}</div>`).join("") || `<div class="small muted">No inline review comments.</div>`}
      ${p.conversation.length?`<h3 style="margin-top:14px">PR conversation</h3>`+p.conversation.map(c=>`<div class="cm"><b>${esc(c.author)}</b> <span class="small muted">${d10(c.created_at)}</span><p>${esc(c.body)}</p></div>`).join(""):""}</div>
    ${p.reviewer_evals.length?`<div class="card"><h3>Reviewer assessment</h3>${p.reviewer_evals.map(r=>`<div class="issue">${badge(r.score)}<div><b>${esc(r.reviewer)}</b> — ${esc(r.notes)}
      ${r.missed.length?`<div class="small">Missed: ${r.missed.map(esc).join("; ")}</div>`:""}</div></div>`).join("")}</div>`:""}
    ${(p.fixed_by.length||p.fixes.length)?`<div class="card"><h3>Rework</h3>
      ${p.fixed_by.map(r=>`<div class="issue"><span class="badge s-bad">${esc(r.kind.replace(/_/g," "))}</span><div>${r.id===p.id ? "Later fixed by a direct commit (no PR)" : `Later fixed by <a href="#" data-pr="${r.id}">#${r.number} ${esc(r.title)}</a> (${esc(r.author)})`}<div class="small muted">${esc(r.evidence||r.reason)}</div></div></div>`).join("")}
      ${p.fixes.filter(r=>r.id!==p.id).map(r=>`<div class="issue"><span class="badge s-ok">fixes</span><div><a href="#" data-pr="${r.id}">#${r.number} ${esc(r.title)}</a><div class="small muted">${esc(r.evidence)}</div></div></div>`).join("")}</div>`:""}`;
  $("#drawer").scrollTop = 0;
  $("#drawer").classList.add("open"); $("#scrim").classList.add("open");
  $("#close").onclick = closePr;
  $("#drawer").querySelectorAll("[data-pr]").forEach(a => a.onclick = e => { e.preventDefault(); openPr(a.dataset.pr); });
}
function closePr(){ $("#drawer").classList.remove("open"); $("#scrim").classList.remove("open"); }
$("#scrim").onclick = closePr;
document.addEventListener("keydown", e => { if (e.key === "Escape") closePr(); });
$("#period").onchange = () => { $("#custom").style.display = $("#period").value==="custom" ? "" : "none"; refresh(); };
$("#since").onchange = $("#until").onchange = $("#repo").onchange = refresh;
$("#q").oninput = renderUsers;
$("#teamBtn").onclick = () => showTeam();
$("#dashBtn").onclick = () => refresh();
$("#out").onclick = async () => { await fetch("/auth/logout", {method: "POST", credentials: "same-origin", headers: {"X-Requested-With": "audit"}}); location.href = "/login"; };
$("#stdBtn").onclick = async () => {
  const t = await fetch(location.origin + "/api/standards", {credentials: "same-origin"}).then(r => r.text());
  $("#drawer").innerHTML = `<div style="display:flex;justify-content:space-between"><h2 style="margin:0">Review standards</h2><button id="close">✕</button></div><div class="mdv">${md(t)}</div>`;
  $("#drawer").classList.add("open"); $("#scrim").classList.add("open"); $("#close").onclick = closePr;
};
boot();
</script>
</body>
</html>
