# docker compose up -d --build   -> the app on http://<host>:8765 (sign-in as configured in .env)
# Collect and score from the UI (Run page). One-off from a terminal if you prefer:
#   docker compose exec dashboard python audit.py score --engine llm --collect --repos org/repo --months 3 --max-usd 5
# The database lives in ./data/audit.db on the host - copy an existing audit.db there before the first start (optional).
services:
  dashboard:
    build: .
    image: pr-audit
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORT:-8765}:8765"
    environment:
      PORT: "8765"
    volumes:
      - ./data:/data
